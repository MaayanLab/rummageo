version: '3.9'

x-kubernetes:
  name: rummageo
  namespace: rummageo

services:
  rummageo-app:
    platform: linux/amd64
    build: .
    image: maayanlab/rummageo:0.1.01
    environment:
      - DATABASE_URL=postgres://postgres:${POSTGRES_PASSWORD}@rummageo-postgres-3/postgres
      - AUTHORIZATION_HEADER=$AUTHORIZATION_HEADER
      - NODE_ENV=production
      - ENRICH_URL=http://rummageo-enrich-2:8000
      - NEXT_PUBLIC_GA_MEASUREMENT_ID=$NEXT_PUBLIC_GA_MEASUREMENT_ID
      - OPENAI_API_KEY=$OPENAI_API_KEY
    ports:
      - 3000:3000
    x-kubernetes:
      imagePullPolicy: IfNotPresent
      annotations:
        maayanlab.cloud/ingress: https://rummageo.com

  rummageo-enrich:
    platform: linux/amd64
    build: enrich
    image: maayanlab/rummageo-enrich:0.2.0
    environment:
      - 'ROCKET_DATABASES={postgres={url="postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@rummageo-postgres/${POSTGRES_DB}"}}'
    ports:
      - 8000:8000
    x-kubernetes:
      imagePullPolicy: IfNotPresent

  rummageo-enrich-2:
    platform: linux/amd64
    build: enrich
    image: maayanlab/rummageo-enrich:0.1.4
    environment:
      - 'ROCKET_DATABASES={postgres={url="postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@rummageo-postgres-2/${POSTGRES_DB}"}}'
    ports:
      - 8000:8000
    x-kubernetes:
      imagePullPolicy: IfNotPresent

  rummageo-postgres-2:
    platform: linux/amd64
    build: db
    image: maayanlab/rummageo-postgres:0.0.4
    environment:
      - POSTGRES_DB
      - POSTGRES_USER
      - POSTGRES_PASSWORD
      - ENRICH_URL=http://rummageo-enrich-2:8000
    ports:
      - 5432
    volumes:
      - rummageo-data-2:/var/lib/postgresql/data
    x-kubernetes:
      imagePullPolicy: IfNotPresent

  rummageo-postgres-3:
    platform: linux/amd64
    build: db
    image: maayanlab/rummageo-postgres:0.0.4
    environment:
      - POSTGRES_DB
      - POSTGRES_USER
      - POSTGRES_PASSWORD
      - ENRICH_URL=http://rummageo-enrich:8000
    ports:
      - 5432
    volumes:
      - rummageo-data-3:/var/lib/postgresql/data
    x-kubernetes:
      imagePullPolicy: IfNotPresent

volumes:
  rummageo-data-2:
    x-kubernetes:
      size: 20Gi
      class: gp2

  rummageo-data-3:
    x-kubernetes:
      size: 30Gi
      class: gp2